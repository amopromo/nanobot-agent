image:
  repository: amopromo/nanobot-k8s-agent
  # Com uma tag fixa (ex.: 0.1.0), troque pullPolicy para IfNotPresent. Vazio: appVersion do chart
  tag: latest
  pullPolicy: Always

# Nome do cluster: vira a pasta no storage e precisa ser igual ao cadastrado no Nanobot (Admin > Kubernetes)
clusterName: ""

storage:
  # Bucket e prefixo compartilhados pelos clusters: s3://bucket/prefixo, gs://bucket/prefixo ou r2://bucket/prefixo
  path: ""

credentials:
  # Secret já existente com a chave credentials.json (recomendado: fora do values)
  existingSecret: ""
  # Sem existingSecret, o chart cria o Secret com este JSON (o mesmo formato cadastrado no Nanobot).
  # O agente precisa listar, ler, gravar e apagar no prefixo do storage. encryption_key (opcional, 32 bytes em base64:
  # openssl rand -base64 32): os arquivos vão criptografados (AES-256-GCM) para o storage; a mesma chave no Nanobot.
  json: |
    {
      "type": "s3",
      "key_id": "",
      "secret": "",
      "region": "us-east-1",
      "endpoint": "",
      "url_style": "",
      "encryption_key": ""
    }

collection:
  sampleInterval: 60s   # coleta de uso/status de pods e nós
  flushInterval: 60s    # gravação no storage (atraso máximo dos dados no Nanobot)
  maintenanceInterval: 10m # junta os arquivos de cada flush (por hora e por dia) e aplica a retenção
  summaryConcurrency: 8 # nós consultados em paralelo (summary do kubelet)
  # Mudança de estado de pod/HPA (caiu, não pronto, CrashLoopBackOff, Pending sem nó, escalou) dispara uma coleta e um
  # envio na hora, com o uso de CPU/memória da última coleta; reactiveMinInterval: intervalo mínimo entre duas coletas
  reactive: true
  reactiveMinInterval: 10s

# Namespaces ignorados: os pods deles não entram nas telas nem nos logs, só nos totais dos nós (requests, pods).
# Lista vazia ([]) coleta todos.
excludeNamespaces: [kube-system, kube-public, kube-node-lease]

logs:
  enabled: true
  namespaces: []        # vazio: todos
  excludeNamespaces: []
  maxLineBytes: 16384

# Retenção: 0 (padrão) o agente não apaga nada e quem apaga os dias antigos é o Nanobot.
# Maior que 0: o próprio agente apaga os dias mais antigos.
retentionDays: 0

# Varredura de vulnerabilidades das imagens em uso (Trivy). Quem liga e agenda é o Nanobot (cadastro do cluster), que
# grava <storage>/<cluster>/_config/security.json; aqui ficam só as imagens e os limites dos Jobs. Um Job por vez, no
# namespace do agente e no nó onde a imagem já está (sem baixar do registry), apagado no fim.
security:
  enabled: true           # false: o agente ignora o _config/security.json (não cria Jobs e não precisa do Role)
  trivyImage: aquasec/trivy:0.75.0
  # Repositórios do banco do Trivy (vazio: mirror.gcr.io, público, e depois ghcr.io). Clusters sem internet: um
  # registry interno com uma cópia do banco (ex.: harbor.local/aquasec/trivy-db:2)
  dbRepository: ""
  javaDbRepository: ""
  imagesPerJob: 8         # imagens varridas em sequência por Job (o banco é baixado uma vez por Job)
  imageTimeout: 5m
  jobGap: 30s             # pausa entre dois Jobs
  configInterval: 5m      # leitura da configuração gravada pelo Nanobot
  # Limites de cada container do Job (um por vez). Imagens com muitos .jar usam mais memória: se estourar, a
  # imagem é varrida de novo, sozinha, com memoryLimitRetry
  resources:
    cpuRequest: 50m
    cpuLimit: 500m
    memoryRequest: 128Mi
    memoryLimit: 384Mi
    memoryLimitRetry: 768Mi
  # emptyDir do Job: banco do Trivy (~1,5 GB) e, se houver .jar nas imagens, o banco Java (~1,5 GB)
  workdirSizeLimit: 4Gi
  # PriorityClass dos Jobs: negativa e sem preempção (os pods das aplicações sempre têm preferência)
  priorityClass:
    create: true
    name: nanobot-k8s-scan
    value: -100

# emptyDir em /data: arquivos esperando o storage voltar e a área da compactação (uma hora de logs por vez)
bufferSizeLimit: 2Gi
logLevel: info

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
