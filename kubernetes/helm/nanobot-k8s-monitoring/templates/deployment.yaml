apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nanobot-k8s.fullname" . }}
  labels:
    {{- include "nanobot-k8s.labels" . | nindent 4 }}
spec:
  # Uma réplica só: duas gravariam as mesmas janelas no storage
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nanobot-k8s.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nanobot-k8s.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.credentials.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nanobot-k8s.fullname" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # Tempo para o flush final do buffer no storage
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "nanobot-k8s.fullname" . }}
          env:
            # O GC do Go trabalha abaixo de 85% do limit (sem limit: a memória do nó)
            - name: MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: credentials
              mountPath: /etc/nanobot-k8s
              readOnly: true
            - name: buffer
              mountPath: /data
      volumes:
        - name: credentials
          secret:
            secretName: {{ include "nanobot-k8s.secretName" . }}
        # Spool dos arquivos que ainda não subiram (storage fora do ar) e área da compactação
        - name: buffer
          emptyDir:
            sizeLimit: {{ .Values.bufferSizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
