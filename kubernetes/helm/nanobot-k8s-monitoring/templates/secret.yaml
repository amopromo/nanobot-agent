{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nanobot-k8s.secretName" . }}
  labels:
    {{- include "nanobot-k8s.labels" . | nindent 4 }}
type: Opaque
stringData:
  credentials.json: |
    {{- .Values.credentials.json | nindent 4 }}
{{- end }}
